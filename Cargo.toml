[package]
name = "quotamonitori"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Minimal native multi-account Codex quota monitor"
license = "MIT"
build = "build.rs"

[[bin]]
name = "QuotaMonitori"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
fs2 = "0.4"
open = "5"
url = "2"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }
tar = "0.4"
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
sha2 = "0.10"



