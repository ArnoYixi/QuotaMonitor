name: Verify Windows floating interface
on:
  push:
    branches: [diagnostics/windows-ui]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for compiled executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i=0; $i -lt 36; $i++) {
            $r = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} -Uri 'https://api.github.com/repos/ArnoYixi/QuotaMonitori/actions/runs/38499707963/artifacts'
            if ($r.artifacts | Where-Object { $_.name -eq 'QuotaMonitori-windows-x64-static' }) { exit 0 }
            Start-Sleep -Seconds 10
          }
          throw 'Compiled artifact unavailable'
      - uses: actions/download-artifact@v4
        with:
          name: QuotaMonitori-windows-x64-static
          run-id: 38499707963
          github-token: ${{ github.token }}
          path: dist
      - shell: pwsh
        run: ./scripts/prepare-ui-test.ps1
      - shell: pwsh
        run: ./scripts/test-window.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verified-QuotaMonitori-windows-x64-static
          path: dist/
          compression-level: 0
